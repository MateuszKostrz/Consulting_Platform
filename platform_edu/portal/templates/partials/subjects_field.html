<div class="col-md-6" data-subjects-field>
  <label for="{{ field_id|default:'subjects' }}" class="form-label">Subjects</label>
  <select id="{{ field_id|default:'subjects' }}" name="subjects" class="select2-subjects form-select" multiple data-subjects-select>
    {% for value, label in ib_subjects %}
    <option value="{{ value }}" {% if value in selected_subjects %}selected{% endif %}>{{ label }}</option>
    {% endfor %}
  </select>

  <div class="mt-3" data-custom-subjects-wrap>
    <label class="form-label mb-2">Other subjects</label>
    <div data-custom-subjects-list>
      {% for custom in custom_subjects %}
      <div class="input-group mb-2" data-custom-subject-row>
        <input
          type="text"
          class="form-control"
          name="subjects_custom"
          value="{{ custom }}"
          placeholder="Subject name" />
        <button type="button" class="btn btn-outline-secondary" data-remove-custom-subject aria-label="Remove subject">&times;</button>
      </div>
      {% endfor %}
    </div>
    <button type="button" class="btn btn-sm btn-outline-primary" data-add-custom-subject>Add another</button>
  </div>
</div>

<template id="customSubjectRowTemplate">
  <div class="input-group mb-2" data-custom-subject-row>
    <input
      type="text"
      class="form-control"
      name="subjects_custom"
      value=""
      placeholder="Subject name" />
    <button type="button" class="btn btn-outline-secondary" data-remove-custom-subject aria-label="Remove subject">&times;</button>
  </div>
</template>
