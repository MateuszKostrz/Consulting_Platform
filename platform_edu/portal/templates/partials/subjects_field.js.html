<script>
(function () {
  if (window.__subjectsFieldReady) {
    return;
  }
  window.__subjectsFieldReady = true;

  const OTHER_LEVEL = 'Other';

  function syncLevelOther(row) {
    const levelSelect = row.querySelector('[data-subject-level]');
    const wrap = row.querySelector('[data-subject-level-other-wrap]');
    const otherInput = row.querySelector('[data-subject-level-other]');
    if (!levelSelect || !wrap) {
      return;
    }
    const isOther = levelSelect.value === OTHER_LEVEL;
    wrap.classList.toggle('d-none', !isOther);
    if (otherInput && isOther) {
      otherInput.focus();
    }
  }

  function bindSubjectRow(row) {
    const levelSelect = row.querySelector('[data-subject-level]');
    if (!levelSelect) {
      return;
    }
    syncLevelOther(row);
    levelSelect.addEventListener('change', function () {
      syncLevelOther(row);
    });
  }

  function addSubjectRow(listEl) {
    const template = document.getElementById('subjectRowTemplate');
    if (!template || !listEl) {
      return null;
    }
    const row = template.content.firstElementChild.cloneNode(true);
    listEl.appendChild(row);
    bindSubjectRow(row);
    const nameInput = row.querySelector('input[name="subjects_name"]');
    if (nameInput) {
      nameInput.focus();
    }
    return row;
  }

  function initSubjectsField(field) {
    const listEl = field.querySelector('[data-subjects-list]');
    const addBtn = field.querySelector('[data-add-subject]');
    if (!listEl) {
      return;
    }

    listEl.querySelectorAll('[data-subject-row]').forEach(bindSubjectRow);

    if (addBtn) {
      addBtn.addEventListener('click', function () {
        addSubjectRow(listEl);
      });
    }

    field.addEventListener('click', function (event) {
      const removeBtn = event.target.closest('[data-remove-subject]');
      if (!removeBtn) {
        return;
      }
      const row = removeBtn.closest('[data-subject-row]');
      if (!row) {
        return;
      }
      const rows = listEl.querySelectorAll('[data-subject-row]');
      if (rows.length <= 1) {
        row.querySelectorAll('input').forEach(function (input) {
          input.value = '';
        });
        const levelSelect = row.querySelector('[data-subject-level]');
        if (levelSelect) {
          levelSelect.value = '';
        }
        syncLevelOther(row);
        return;
      }
      row.remove();
    });
  }

  document.querySelectorAll('[data-subjects-field]').forEach(initSubjectsField);
})();
</script>

<script>
(function () {
  if (window.__curriculumOtherReady) {
    return;
  }
  window.__curriculumOtherReady = true;

  const OTHER_VALUE = 'Other';

  function syncCurriculumOther(selectEl) {
    const field = selectEl.closest('[data-curriculum-field]');
    if (!field) {
      return;
    }
    const wrap = field.querySelector('[data-curriculum-other-wrap]');
    const otherInput = field.querySelector('[data-curriculum-other-input]');
    if (!wrap || !otherInput) {
      return;
    }

    const isOther = selectEl.value === OTHER_VALUE;
    wrap.classList.toggle('d-none', !isOther);
    otherInput.required = isOther;
    if (isOther) {
      otherInput.focus();
    }
  }

  function initCurriculumField(field) {
    const selectEl = field.querySelector('[data-curriculum-select]');
    if (!selectEl) {
      return;
    }
    syncCurriculumOther(selectEl);
    selectEl.addEventListener('change', function () {
      syncCurriculumOther(selectEl);
    });
  }

  document.querySelectorAll('[data-curriculum-field]').forEach(initCurriculumField);
})();
</script>
