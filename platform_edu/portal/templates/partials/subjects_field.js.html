<script>
(function () {
  if (window.__subjectsFieldReady) {
    return;
  }
  window.__subjectsFieldReady = true;

  function initSubjectsSelect(selectEl) {
    if (window.jQuery && jQuery.fn.select2) {
      jQuery(selectEl).select2({
        placeholder: 'Select your subjects',
        allowClear: true,
        width: '100%',
      });
    }
  }

  function addCustomSubjectRow(listEl, value) {
    const template = document.getElementById('customSubjectRowTemplate');
    if (!template || !listEl) {
      return null;
    }

    const row = template.content.firstElementChild.cloneNode(true);
    const input = row.querySelector('input[name="subjects_custom"]');
    if (input && value) {
      input.value = value;
    }
    listEl.appendChild(row);
    if (input) {
      input.focus();
    }
    return row;
  }

  function initCustomSubjects(field) {
    const listEl = field.querySelector('[data-custom-subjects-list]');
    const addBtn = field.querySelector('[data-add-custom-subject]');
    if (!listEl || !addBtn) {
      return;
    }

    addBtn.addEventListener('click', function () {
      addCustomSubjectRow(listEl, '');
    });

    field.addEventListener('click', function (event) {
      const removeBtn = event.target.closest('[data-remove-custom-subject]');
      if (!removeBtn) {
        return;
      }
      const row = removeBtn.closest('[data-custom-subject-row]');
      if (row) {
        row.remove();
      }
    });
  }

  document.querySelectorAll('[data-subjects-select]').forEach(initSubjectsSelect);
  document.querySelectorAll('[data-subjects-field]').forEach(initCustomSubjects);
})();
</script>

<script>
(function () {
  if (window.__curriculumOtherReady) {
    return;
  }
  window.__curriculumOtherReady = true;

  const OTHER_VALUE = 'Other';

  function syncCurriculumOther(selectEl) {
    const field = selectEl.closest('[data-curriculum-field]');
    if (!field) {
      return;
    }
    const wrap = field.querySelector('[data-curriculum-other-wrap]');
    const otherInput = field.querySelector('[data-curriculum-other-input]');
    if (!wrap || !otherInput) {
      return;
    }

    const isOther = selectEl.value === OTHER_VALUE;
    wrap.classList.toggle('d-none', !isOther);
    otherInput.required = isOther;
    if (isOther) {
      otherInput.focus();
    }
  }

  function initCurriculumField(field) {
    const selectEl = field.querySelector('[data-curriculum-select]');
    if (!selectEl) {
      return;
    }
    syncCurriculumOther(selectEl);
    selectEl.addEventListener('change', function () {
      syncCurriculumOther(selectEl);
    });
  }

  document.querySelectorAll('[data-curriculum-field]').forEach(initCurriculumField);
})();
</script>
