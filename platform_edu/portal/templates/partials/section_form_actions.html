<div class="mt-6 d-flex flex-wrap gap-2 section-form-actions">
  {% if show_save|default:True %}
  <button type="submit" class="btn btn-outline-primary section-form-save-btn">Save</button>
  {% endif %}
  <button type="button" class="btn btn-primary section-form-continue-btn">Continue</button>
  <button type="button" class="btn btn-outline-secondary section-form-cancel-btn">Cancel</button>
</div>
